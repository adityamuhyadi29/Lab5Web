<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JavaScript</title>
</head>
<body>
    <h1 id="pesan"></h1>
    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">
    <button type="button" onclick="cekBilangan()">Periksa</button>
    <p id="hasilBilangan"></p>

    <h3>Ubah Warna Latar</h3>
    <button type="button" onclick="ubahWarnaLatar('lightgreen')">
        Latar hijau
    </button>
    <button type="button" onclick="ubahWarnaLatar('white')">
        Latar putih
    </button>
    <button type="button" onclick="ubahWarnaLatar('lightyellow')">
        Latar Kuning
    </button>

    <h3>Daftar Menu Makan</h3>
    <label><input type="checkbox" class="menu" value="5000"> Ayam gorng - Rp5.000</label><br>
    <label><input type="checkbox" class="menu" value="500"> Tempe - Rp500</label><br>
    <label><input type="checkbox" class="menu" value="2500"> Telur Dadar - Rp2.500</label><br>
    <p>Total: Rp<span id="total">0</span></p>

    <script src="script.js" defer></script>

    <script>
        function cekBilangan() {
            const input = document.getElementById("bilangan").value;
            const angka = Number(input);
            const hasil = document.getElementById("hasilBilangan");
            if (input.trim() === "" || !Number.isInteger(angka)) {
                hasil.textContent = "Masukkan bilangan bulat yang valid.";
            } else if (angka % 2 === 0) {
                hasil.textContent = "Bilangan genap";
            } else {
                hasil.textContent = "Bilangan ganjil";
            }
        }
        function ubahWarnaLatar(warna) {
            document.body.style.backgroundColor = warna;
        }
    </script>
</body>
</html>
